name: CI

on: 
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
          cache: pip
          cache-dependency-path: backend/requirements*.txt
          
      name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Python code
        run: python -m ruff check backend

      - name: Run API tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q

      - name: Audit runtime dependencies
        run: python -m pip-audit -r backend/requirements.txt --no-deps --disable-pip
      
      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and Start services
        run: docker compose upp --build -d --wait

      - name: Verify frontend and API proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          payload = {
              "initial_principal": 1000,
              "monthly_contribution": 100,
              "annual_rate": 0,
              "years": 2,
          }
          request = Request(
              "http://127.0.0.1:8080/api/simulate",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urlopen(request, timeout=10) as response:
              result = json.load(response)

          assert result["final_balance"] == "3400.00"
          assert result["total_contributions"] == "3400.00"
          assert result["interest"] == "0.00"
          assert len(result["annual_progression"]) == 2
          print("Frontend API proxy smoke test passed.")
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop services
        if: always()
        run: docker compose down